spring.application.name=yeren-miras-student-api
server.port=8081

# Database settings come from environment variables (defaults are for local development only)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/studentdb}
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD:student_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Individual student data
app.student.full-name=Miras Yeren
app.student.group=IT2-2308
app.student.id=41517
app.version=v1.0-yeren-miras-41517
